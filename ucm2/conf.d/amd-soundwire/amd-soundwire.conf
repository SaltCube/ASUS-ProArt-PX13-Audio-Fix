Syntax 7

# AMD SoundWire - ASUS ProArt PX13 (HN7306EAC)
# RT721 SDCA headphones/headset + TAS2783 SmartAmp speakers + ACP DMIC
#
# This overrides the system amd-soundwire UCM config which only creates
# Headphone and Headset devices (no Speaker or Mic) because the kernel
# driver does not report spk: or mic: in CardComponents.
#
# AMD ACP70 SoundWire driver reports CardComponents as
# "cfg-amp:2 hs:rt721" but omits spk: and mic: entries.
# this config hardcodes the missing device definitions.

SectionUseCase."HiFi" {
	File "HiFi.conf"
	Comment "Play HiFi quality Music"
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

# RT721 codec initialization - mixer routing and default volumes
Include.codec-init.File "/codecs/rt721/init.conf"