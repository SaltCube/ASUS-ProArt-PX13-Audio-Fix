# HiFi verb: RT721 + TAS2783 + ACP DMIC
#
# Devices:
#   Speaker      TAS2783 SmartAmp (PCM 2, stereo, SoundWire)
#   Headphones   RT721 SDCA headphone jack (PCM 0, SoundWire)
#   Mic          ACP PDM dual-mic array (PCM 4)
#   Headset      RT721 SDCA headset mic jack (PCM 1, SoundWire)
#
# PCM 3 (SmartAmp IV-sense capture) is intentionally NOT defined.
# Configuring that stream's transport params fails with -EINVAL
# and corrupts the entire SoundWire bus.

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "TAS2783 SmartAmp Speakers"

	ConflictingDevice [
		"Headphones"
	]

	# Two TAS2783 chips on SoundWire bus 0, link 1:
	#   tas2783-1 (unique ID 0x8) -> "Left Spk" / "Spk"
	#   tas2783-2 (unique ID 0xb) -> "Right Spk" / "Spk2"
	# Each has a Left and Right mute gate
	# The kernel exposes no source-select or slot-select for the TAS2783 path.
	# With any switch off, at least one speaker goes silent, so all four must be enabled.
	# This does not fix stereo separation
	EnableSequence [
		cset "name='Left Spk Switch' on"
		cset "name='Right Spk Switch' on"
		cset "name='Left Spk2 Switch' on"
		cset "name='Right Spk2 Switch' on"
	]

	DisableSequence [
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
		cset "name='Left Spk2 Switch' off"
		cset "name='Right Spk2 Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Headphone Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId}"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='rt721 FU1E Capture Switch' 1"
	]

	DisableSequence [
		cset "name='rt721 FU1E Capture Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},4"
		CaptureSwitch "rt721 FU1E Capture Switch"
		CaptureVolume "rt721 FU1E Capture Volume"
		CaptureMixerElem "rt721 FU1E"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='rt721 FU0F Capture Switch' 1"
	]

	DisableSequence [
		cset "name='rt721 FU0F Capture Switch' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		JackControl "Headset Mic Jack"
		CaptureSwitch "rt721 FU0F Capture Switch"
		CaptureVolume "rt721 FU0F Capture Volume"
		CaptureMixerElem "rt721 FU0F"
	}
}
