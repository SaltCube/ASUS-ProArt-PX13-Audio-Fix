#
# The entry is matched by title, and its DownloadUrl.Global is an unsigned
# dlcdnets.asus.com link. The DOWNLOAD button on the support page is a
# different thing: a CloudFront signed URL on dlcdnta.asus.com carrying
# Signature, Expires and Key-Pair-Id, which expires within about a day and so
# cannot be recorded anywhere.
