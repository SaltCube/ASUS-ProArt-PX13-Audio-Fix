monitor.alsa.rules = [
  {
    matches = [
      # Regex match ("~" prefix): ".*" covers the PCI BDF so this survives
      # hardware address changes. (A previous version used glob-style
      # "pci-*" which, as regex, never matched - leaving this whole rule
      # silently inert.)
      { device.name = "~alsa_card.pci-.*-platform-amd_sdw" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        # Hide the Pro Audio profile: it bypasses UCM and exposes the
        # broken SmartAmp IV-sense capture PCM, which fails with -EINVAL
        # and can corrupt the SoundWire bus.
        api.acp.disable-pro-audio = true
        device.profile = "HiFi"
      }
    }
  }
  # Prevents PipeWire from suspending the speaker node during idle.
  # Originally added to avoid assumed SoundWire bus desync on idle-suspend,
  # but runtime dropouts were never confirmed. May not be necessary -
  # and may worsen suspend/resume by keeping the stream open during system sleep.
  # {
  #   matches = [
  #     { node.name = "~alsa_output.pci-.*-platform-amd_sdw.HiFi__Speaker__sink" }
  #   ]
  #   actions = {
  #     update-props = {
  #       session.suspend-timeout-seconds = 0
  #     }
  #   }
  # }
]
