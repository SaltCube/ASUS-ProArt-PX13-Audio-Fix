# Use case configuration for TI TAS2783 SmartAmp speakers (SoundWire)
#
# Missing from alsa-ucm-conf (<= 1.2.16.1): the kernel (7.2+) reports
# "spk:tas2783" in CardComponents, which makes sof-soundwire/HiFi.conf
# include this file; without it the whole UCM profile fails to load and
# the card gets no devices at all.
#
# Two TAS2783 amps share one stereo playback stream (PCM 2). Each amp's
# DSP extracts its own channel (see docs/investigation-log.md
# in the ASUS-ProArt-PX13-Audio-Fix repo). The four switches are per-amp
# DAPM mute gates, not channel routing - all must be on for both speakers
# to play.
#
# The SmartAmp IV-sense capture stream (PCM 3) is intentionally not
# defined: configuring it fails with -EINVAL and can corrupt the
# SoundWire bus.

SectionDevice."Speaker" {
	Comment "TAS2783 SmartAmp Speakers"

	# Stereo separation: the per-amp DSP posture selects which channel
	# each amp renders (validated 2026-07-18: posture 1 = left only,
	# posture 4 = right only, matching the ACPI init tables that the
	# kernel fails to apply). The posture kcontrols only exist with the
	# patched tas2783 module (patches/phase1-tas2783-posture-kcontrols.patch),
	# so guard on their presence to keep the profile working on a stock
	# kernel (which then falls back to both amps playing an L+R mix).
	If.posture {
		Condition {
			Type ControlExists
			Control "name='tas2783-2 DSP Posture Select'"
		}
		True.EnableSequence [
			cset "name='tas2783-1 DSP Posture Select' 1"
			cset "name='tas2783-2 DSP Posture Select' 4"
		]
	}

	EnableSequence [
		cset "name='Left Spk Switch' on"
		cset "name='Right Spk Switch' on"
		cset "name='Left Spk2 Switch' on"
		cset "name='Right Spk2 Switch' on"
	]

	DisableSequence [
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
		cset "name='Left Spk2 Switch' off"
		cset "name='Right Spk2 Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
